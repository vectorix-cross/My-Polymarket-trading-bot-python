[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorix-polymarket"
version = "0.1.0"
description = "Vectorix Polymarket trading bot: Gamma discovery, CLOB books, edge scan, paper execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vectorix", email = "vanjasretenovic4@gmail.com" }]
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/vectorix-cross/My-Polymarket-trading-bot-python"
Repository = "https://github.com/vectorix-cross/My-Polymarket-trading-bot-python"

[tool.setuptools.packages.find]
where = ["src"]
